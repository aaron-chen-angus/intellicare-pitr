<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#bfe4ff" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="intelliCARE – Person in the Rain Activity: a guided, reflective drawing activity. Not a psychological test or diagnosis." />
    <link rel="icon" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>intelliCARE – Person in the Rain Activity</title>
  </head>
  <body>
    <div id="root"><div class="boot-message" style="max-width:640px;margin:15vh auto;padding:28px;color:#1b2a3b;background:#ffffff;border-radius:22px;font-family:system-ui,sans-serif;line-height:1.6"><h1>Loading intelliCARE – Person in the Rain Activity…</h1><p>If this message stays here, the application’s compiled JavaScript has not loaded. GitHub Pages must deploy the built site, not the raw React source files.</p></div></div>
    <noscript>This activity needs JavaScript enabled to open the drawing studio.</noscript>
    <script>
      window.addEventListener('error', function (event) {
        if (event.target && event.target.tagName === 'SCRIPT') {
          var message = document.querySelector('.boot-message');
          if (message) message.innerHTML = '<h1>The studio could not load.</h1><p>The application script is missing or was served incorrectly. Check that GitHub Pages deploys the compiled build, then reload.</p>';
        }
      }, true);
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
